<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odoo WhatsApp Login</title>
<style>
  :root {
    --primary-color: #8B008B;
    --secondary-color: #FF69B4;
    --tertiary-color: #483D8B;
    --background-color: #1C1C2D;
    --light-glow: #E6E6FA;
    --grey: #808080;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: var(--background-color);
    color: var(--light-glow);
    padding: 20px;
    min-height: 100vh;
  }
  .wrap { max-width: 1100px; margin: 0 auto; }

  .header {
    background: var(--light-glow);
    color: var(--primary-color);
    padding: 28px 20px;
    border-radius: 8px;
    margin-bottom: 24px;
    text-align: center;
  }
  .logo { font-size: 44px; font-weight: 800; letter-spacing: -1px; }
  .logo .o1 { color: #714B67; }
  .logo .x { color: var(--secondary-color); margin: 0 10px; font-weight: 400; }
  .logo .wa { color: #25D366; }
  .header p { color: var(--tertiary-color); margin-top: 6px; font-weight: 600; }

  .login {
    max-width: 380px;
    margin: 60px auto 0;
    padding: 32px 24px;
    border: 2px solid var(--primary-color);
    border-radius: 8px;
    text-align: center;
  }
  .login h2 { color: var(--secondary-color); margin-bottom: 8px; }
  .login p { color: var(--grey); font-size: 14px; margin-bottom: 24px; }

  .submit-button {
    display: block;
    width: 100%;
    background: var(--primary-color);
    color: var(--light-glow);
    border: none;
    padding: 12px 15px;
    border-radius: 5px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }
  .submit-button:hover { background: #a000a0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="logo"><span class="o1">odoo</span><span class="x">×</span><span class="wa">WhatsApp</span></div>
    <p>Local Mock API &amp; Test Suite for Odoo Engineers</p>
  </div>

  <div class="login">
    <h2>Connect WhatsApp</h2>
    <p>Simulated OAuth — authorize Odoo to access your WhatsApp Business Account.</p>
    <button class="submit-button" type="button">Log in</button>
  </div>
</div>
</body>
</html>
